name: pre-commit

on:
  pull_request:
  push:
    branches:
      - main
      - first-version-vre-chart

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      # vre/charts is gitignored, so there is nothing to render without this
      - name: Cache chart dependencies
        id: charts
        uses: actions/cache@v4
        with:
          path: vre/charts
          key: chart-deps-${{ hashFiles('vre/Chart.yaml') }}

      - name: Fetch chart dependencies
        if: steps.charts.outputs.cache-hit != 'true'
        run: helm dependency update ./vre

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
