{{- if .Values.mdcDataRclone.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.mdcDataRclone.pvName }}
  labels:
    name: {{ .Values.mdcDataRclone.pvName }}
spec:
  accessModes:
    - ReadOnlyMany
  capacity:
    storage: {{ .Values.mdcDataRclone.capacity }}
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: {{ .Values.mdcDataRclone.pvcName }}
    namespace: {{ .Release.Namespace }}
  csi:
    driver: csi-rclone
    readOnly: {{ .Values.mdcDataRclone.readOnly }}
    volumeAttributes:
      configData: |

        [{{ .Values.mdcDataRclone.remoteName }}]

        type = webdav
        url = {{ required "mdcDataRclone.remoteUrl is required when mdcDataRclone is enabled" .Values.mdcDataRclone.remoteUrl }}
        vendor = {{ .Values.mdcDataRclone.vendor }}
      remote: {{ .Values.mdcDataRclone.remoteName }}
      remotePath: {{ .Values.mdcDataRclone.remotePath | quote }}
      vendor: {{ .Values.mdcDataRclone.vendor }}
    volumeHandle: {{ .Values.mdcDataRclone.volumeHandle }}
  persistentVolumeReclaimPolicy: {{ .Values.mdcDataRclone.reclaimPolicy }}
  storageClassName: {{ .Values.mdcDataRclone.storageClassName }}
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.mdcDataRclone.pvcName }}
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: {{ .Values.mdcDataRclone.capacity }}
  storageClassName: {{ .Values.mdcDataRclone.storageClassName }}
  volumeMode: Filesystem
  volumeName: {{ .Values.mdcDataRclone.pvName }}
{{- end }}
