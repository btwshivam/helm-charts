apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "escape-vre.fullname" . }}-pre-delete
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 360
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: {{ include "escape-vre.fullname" . }}-bootstrap-sa
      restartPolicy: Never
      containers:
        - name: shutdown-nfs-consumers
          image: alpine/k8s:1.30.14
          command:
            - /bin/sh
            - -ceu
            - |
              namespace="{{ .Release.Namespace }}"
              release="{{ include "escape-vre.fullname" . }}"

              for resource in \
                "deployment/${release}-db" \
                "deployment/${release}-server" \
                "deployment/${release}-workflow-controller" \
                "statefulset/${release}-message-broker"
              do
                if kubectl -n "${namespace}" get "${resource}" >/dev/null 2>&1; then
                  kubectl -n "${namespace}" scale "${resource}" --replicas=0
                else
                  echo "${resource} is already absent"
                fi
              done

              selector="app in (${release}-db,${release}-server,${release}-workflow-controller,${release}-message-broker)"
              pods=$(kubectl -n "${namespace}" get pods -l "${selector}" -o name)

              if [ -n "${pods}" ]; then
                kubectl -n "${namespace}" wait \
                  --for=delete ${pods} \
                  --timeout=300s
              fi
