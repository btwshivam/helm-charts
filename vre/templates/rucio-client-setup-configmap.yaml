{{- if .Values.rucioClientSetup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.rucioClientSetup.configMapName }}
  namespace: {{ .Release.Namespace }}
data:
  postStart_rucio.sh: |
    #!/bin/bash

    set -eu
    if [ "${SKIP_POSTSTART_HOOK:-false}" = "true" ]; then
      echo "Rucio client setup skipped"
    else
      : "${RUCIO_ACCESS_TOKEN:?RUCIO_ACCESS_TOKEN is required}"
      : "${RUCIO_BASE_URL:?RUCIO_BASE_URL is required}"
      : "${RUCIO_AUTH_URL:?RUCIO_AUTH_URL is required}"

      rucio_base_url="${RUCIO_BASE_URL%/}"
      rucio_auth_url="${RUCIO_AUTH_URL%/}"

      mkdir -pv /certs /tmp
      printf '%s' "${RUCIO_ACCESS_TOKEN}" > /tmp/rucio_oauth.token
      chmod 600 /tmp/rucio_oauth.token
      mkdir -pv /opt/rucio/etc

      cat > /opt/rucio/etc/rucio.cfg <<EOL
      [client]
      rucio_host = ${rucio_base_url}
      auth_host = ${rucio_auth_url}
      # account = $JUPYTERHUB_USER
      auth_type = oidc
      oidc_audience = rucio
      oidc_polling = true
      # oidc_issuer = escape
      auth_oidc_refresh_activate = true
      oidc_issuer = et-indigo-iam
      request_retries = 3
      oidc_scope = openid profile offline_access
      auth_token_file_path = /tmp/rucio_oauth.token
      multi_host_commands = whoami, ping, list, download
      multi_host_servers = ET server, CE server

      [ET server]
      config_file = /opt/rucio/etc/rucio.cfg
      [CE server]
      config_file = /opt/rucio/etc/rucio_CE.cfg
    EOL

      cat > /opt/rucio/etc/rucio_CE.cfg <<EOL
      [client]
      rucio_host = ${rucio_base_url}:8443
      auth_host = ${rucio_auth_url}:8443
      # account = $JUPYTERHUB_USER
      auth_type = oidc
      oidc_issuer = et-indigo-iam
      # oidc_issuer = escape
      oidc_audience = rucio
      oidc_scope = openid profile offline_access
      oidc_polling = true
      auth_oidc_refresh_activate = true
      request_retries = 3
    EOL
    fi
{{- end }}
