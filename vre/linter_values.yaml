# fake values, just enough to render the chart while linting
bootstrap:
  reanaAdminEmail: lint@example.invalid
  reanaAdminPassword: lint-only-not-a-real-password

jupyterhub:
  hub:
    config:
      RucioAuthenticator:
        client_id: lint-only
        client_secret: lint-only

reana:
  secrets:
    login:
      iam:
        consumer_key: lint-only
        consumer_secret: lint-only

# rendered by the lint hooks so their values get exercised; the chart ships
# them disabled
grafana:
  enabled: true
prometheus:
  enabled: true
loki:
  enabled: true
fluent-bit:
  enabled: true
