# Bootstrap configuration for the VRE Helm chart
bootstrap:
  enabled: true
  image:
    repository: alpine/k8s
    tag: "1.30.14"
    pullPolicy: IfNotPresent
  initImage:
    repository: postgres
    tag: "17.5"
    pullPolicy: IfNotPresent

  reanaAdminEmail:
  reanaAdminPassword:

multiRI:
  enabled: false

jupyterhub:
  enabled: true

  proxy:
    service:
      type: ClusterIP
  hub:
    service:
      type: ClusterIP
    # network policy needs to be modified to allow access to the Rucio server
    # (disabling it for now as a workaround, see also the ones for singleuser and proxy below)
    networkPolicy:
      enabled: false
    db:
      #upgrade: true
      type: postgres # passed as s secret (dbconnect string) from the jhub-vre-db secret
      url: # set through secret

    config:
      JupyterHub:
        authenticator_class: "generic-oauth"
      RucioAuthenticator:
        client_id:
        client_secret:
        authorize_url: https://iam-escape.cloud.cnaf.infn.it/authorize
        token_url: https://iam-escape.cloud.cnaf.infn.it/token
        userdata_url: https://iam-escape.cloud.cnaf.infn.it/userinfo
        oauth_callback_url: https://jhub-vre.obsuks4.unige.ch/hub/oauth_callback
        username_key: preferred_username
        enable_auth_state: true
        allow_all: true
        scope:
          - openid
          - profile
          - email


    extraConfig:

      token-exchange: |
        import pprint
        import os
        import warnings
        import requests
        from oauthenticator.generic import GenericOAuthenticator

        # custom authenticator to enable auth_state and get access token to set as env var for rucio extension
        class RucioAuthenticator(GenericOAuthenticator):
            def __init__(self, **kwargs):
                super().__init__(**kwargs)
                self.enable_auth_state = True

            def exchange_token(self, token):
                params = {
                    'client_id': self.client_id,
                    'client_secret': self.client_secret,
                    'grant_type': 'urn:ietf:params:oauth:grant-type:token-exchange',
                    'subject_token_type': 'urn:ietf:params:oauth:token-type:access_token',
                    'subject_token': token,
                    'scope': 'openid profile',
                    'audience': 'rucio'
                }
                response = requests.post(self.token_url, data=params)
                print("EXCHANGE TOKEN for params", params)
                print(response.json())
                rucio_token = response.json()['access_token']

                return rucio_token

            async def pre_spawn_start(self, user, spawner):
                auth_state = await user.get_auth_state()
                #print("AUTH_state")
                #pprint.pprint(auth_state)
                if not auth_state:
                    # user has no auth state
                    return False

                # define token environment variable from auth_state
                spawner.environment['RUCIO_ACCESS_TOKEN'] = self.exchange_token(auth_state['access_token'])
                spawner.environment['EOS_ACCESS_TOKEN'] = auth_state['access_token']
                spawner.environment['NOPAYLOADDB_TOKEN'] = auth_state['access_token']

        # set the above authenticator as the default
        c.JupyterHub.authenticator_class = RucioAuthenticator

        # enable authentication state
        c.GenericOAuthenticator.enable_auth_state = True

  singleuser:
    cloudMetadata:
      blockWithIptables: false



    defaultUrl: "/lab"
    # The lifecycle hooks are used to create the Rucio configuration file,
    # and the token file by copying the REFRESH_TOKEN from the environment variable to the token file.
    startTimeout: 1200

    lifecycleHooks:
      postStart:
        exec:
          command:
            - "sh"
            - "-c"
            - |
              bash /hooks/rucio/postStart_rucio.sh > /tmp/postStart_rucio.log 2>&1 || true
              bash /hooks/conda/postStart_conda.sh > /tmp/postStart_conda.log 2>&1 || true

    networkPolicy:
      enabled: false


    storage:
      capacity: 100Gi

      extraVolumes:
        # Arbitrary key for identity & ordering
      - name: jupyterhub-shared
        persistentVolumeClaim:
          claimName: data-rclone-pvc
      - name: rucio-client-setup
        configMap:
          name: rucio-client-setup
          defaultMode: 0o755
      - name: conda-setup
        configMap:
          name: conda-setup
          defaultMode: 0o755
      extraVolumeMounts:
        # Arbitrary key for identity & ordering
      - name: jupyterhub-shared
        mountPath: /data
        readOnly: true
      - name: rucio-client-setup
        mountPath: /hooks/rucio
      - name: conda-setup
        mountPath: /hooks/conda

    image:
      name: ghcr.io/vre-hub/vre-singleuser-py311
      tag: sha-281055c
      pullPolicy: Always


    profileList:
      - display_name: "Default environment"
        description: "Based on a scipy notebook environment with a python-3.11 kernel, the rucio jupyterlab extension and the reana client installed."
        default: true
      - display_name: "Default environment, multi-RI rucio 39.2"
        description: "Based on a scipy notebook environment with a python-3.11 kernel, the rucio jupyterlab extension and the reana client installed."
        default: false

    # nodeSelector:
    #   jupyter: singleuser
    # extraTolerations:
    #   - key: jupyter
    #     operator: Equal
    #     value: singleuser
    #     effect: NoSchedule
    # memory:
    #   limit: 3.5G #4G
    #   guarantee: 3G #2G

    cmd: null
    extraEnv:
      RUCIO_BASE_URL: "https://et-rucio-server.to.infn.it"
      RUCIO_AUTH_URL: "https://et-rucio-server.to.infn.it"
      RUCIO_OIDC_AUTH: "env"
      RUCIO_OIDC_ENV_NAME: "RUCIO_ACCESS_TOKEN"
      RUCIO_OIDC_AUDIENCE: "rucio"
      RUCIO_OIDC_POLLING: "true"
      RUCIO_OIDC_REFRESH_ACTIVATE: "true"
      RUCIO_OIDC_ISSUER: "et-indigo-iam"
      RUCIO_OIDC_SCOPE: "openid profile offline_access storage.read:/ storage.modify:/"
      RUCIO_DEFAULT_AUTH_TYPE: "oidc"
      RUCIO_OAUTH_ID: "rucio"
      RUCIO_DESTINATION_RSE: "LOUVAIN"
      RUCIO_RSE_MOUNT_PATH: "/data"
      RUCIO_MODE: "replica"
      RUCIO_WILDCARD_ENABLED: "1"
      RUCIO_NAME: "et-rucio-server.to.infn.it"
      RUCIO_DISPLAY_NAME: "RUCIO - ETAP VRE"
      RUCIO_SITE_NAME: "ETAP"
      RUCIO_MULTI_HOST_COMMANDS: "whoami, ping, list, download"
      RUCIO_MULTI_HOST_SERVERS: "ET server, CE server"


  prePuller:
    hook:
      enabled: true

  ingress:
    enabled: true
    ingressClassName: null
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: letsencrypt
      ingress.kubernetes.io/ssl-redirect: "true"
      traefik.frontend.entryPoints: http,https
    hosts: []

reana:
  enabled: true

  # in 0.9.3 used to set alt passwords
  debug:
    enabled: false

  workspaces:
    retention_rules:
      maximum_period: forever
      cronjob_schedule: "0 2 * * *"  # everyday at 2am
    paths:
      - /var/reana:/var/reana

  shared_storage:
    backend: nfs
    volume_size: 1
    access_modes: ReadWriteMany

  secrets:
    login:
      iam:
        consumer_key:
        consumer_secret:

    database:
      user:
      password:

  components:
    reana_ui:
      enabled: true
      local_users: false
    reana_db:
      enabled: true
    reana_server:
      environment:
        REANA_USER_EMAIL_CONFIRMATION: false
    # reana_workflow_controller:
    #   image: docker.io/mdonadoni/reana-workflow-controller:0.9.1-7e03f0a-cvmfs
    # reana_job_controller:
    #   image: docker.io/reanahub/reana-job-controller-htcondorcern-slurmcern:0.9.1
    reana_workflow_controller:
      imagePullPolicy: IfNotPresent
      image: docker.io/reanahub/reana-workflow-controller:0.9.4
      environment:
        SHARED_VOLUME_PATH: "/var/reana/"
        REANA_JOB_STATUS_CONSUMER_PREFETCH_COUNT: 10


  compute_backends:
    - "kubernetes"
    # - "htcondorcern"
    # - "slurmcern"

  notifications:
    enabled: false
    # email_config:
    #   receiver: escape-cern-ops@cern.ch
    #   sender: escape-cern-ops@cern.ch
    #   login: ""
    #   smtp_server: cernmx.cern.ch
    #   smtp_port: 25

  ingress_override: true

  reana_hostname: "reana-vre.obsuks4.unige.ch"

  db_env_config:
    REANA_DB_NAME: "postgres"
    REANA_DB_PORT: "5432"
    REANA_DB_HOST: "escape-vre-db"
    # There are two more environment variables that should be set in order
    # to connect to a database:
    # REANA_DB_USERNAME: containing the database user name.
    # REANA_DB_PASSWORD: containing the password for the user previously set.
    # Both environment variables should be set inside a Kubernetes secret:
    # `[release-name]-db`

  login:
    - name: "iam"
      type: "keycloak"
      # this is example, to be set on deployment
      config:
        title: "ESCAPE IAM"
        base_url: "https://iam-escape.cloud.cnaf.infn.it"
        realm_url: "https://iam-escape.cloud.cnaf.infn.it"
        auth_url: "https://iam-escape.cloud.cnaf.infn.it/authorize"
        token_url: "https://iam-escape.cloud.cnaf.infn.it/token"
        userinfo_url: "https://iam-escape.cloud.cnaf.infn.it/userinfo"

  ingress:
    enabled: false

  traefik:
    enabled: false

  quota:
    default_disk_limit: 10737418240  # bytes (10 GiB)
    default_cpu_limit: 36000000      # milliseconds (10 hours)

  fluent-bit:
    enabled: false

nfs-server-provisioner:
  enabled: true
  persistence:
    enabled: true
    storageClass: ""
    size: "10Gi"
  storageClass:

    name: escape-vre-shared-volume-storage-class
    # name: reana-infrastructure-volume-storage-class
    mountOptions:
    - tcp
    - nfsvers=4.1
    - retrans=2
    - timeo=30
  tolerations:
  - effect: NoSchedule
    key: CriticalAddonsOnly
    operator: "Exists"


# observability
# note that updated reana also contains prometheus and grafana, but they are not enabled by default

grafana:
  enabled: false

  testFramework:
    enabled: false

  persistentVolume:
    size: "1Gi"
  retention: "15d"

  prometheus-node-exporter:
    enabled: false


prometheus:
  enabled: false

loki:
  enabled: false

  # this is a minimal configuration for loki; the goal of the UC is not to test diverse loki features,
  # but to make sure that loki can collect meaningful logs from the DPPS components

  # needed to run in rancher
  # global:
  #   dnsService: "rke2-coredns-rke2-coredns"

  loki:
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    pattern_ingester:
        enabled: true
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
    ruler:
      enable_api: true

    auth_enabled: false

  test:
    enabled: false

  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
      lokiCanary:
        enabled: false

  minio:
    enabled: true

  deploymentMode: SingleBinary

  rollout_operator:
    enabled: false

  singleBinary:
    replicas: 1

  # Zero out replica counts of other deployment modes
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomCompactor:
    replicas: 0
  bloomGateway:
    replicas: 0


fluent-bit:
  enabled: false
  config:
    rbac:
      create: true
      eventsAccess: true

    inputs: |
      [INPUT]
          Name tail
          Path /var/log/containers/*.log
          multiline.parser docker, cri
          Tag kube.*
          Mem_Buf_Limit 5MB
          Buffer_Chunk_Size 1
          Refresh_Interval 1
          Skip_Long_Lines On


    outputs: |
      [FILTER]
          Name grep
          Match *

      [OUTPUT]
          Name        loki
          Match       *
          Host        {{ .Release.Name }}-loki-gateway
          port        80
          tls         off
          tls.verify  off


rucioClientSetup:
  enabled: false
  configMapName: rucio-client-setup

condaSetup:
  enabled: false
  configMapName: conda-setup

RcloneMount:
  enabled: false
  pvName: data-rclone-pv
  pvcName: data-rclone-pvc
  capacity: 10Gi
  storageClassName: rclone
  volumeHandle: rclone-data-id
  readOnly: true
  remoteName: rclone
  remoteUrl: ""
  remotePath: /
  vendor: other
  reclaimPolicy: Retain

crm:
  enabled: false
  namespace: monitoring

npdb:
  enabled: true
  platform: kubernetes

  backend:
    type: django

  hosts:
    api: npdb-api
    files: npdb-files

  postgresql:
    enabled: true
    auth:
      username: cdb
      password: change-me
      database: cdb
    primary:
      persistence:
        enabled: true
        size: 8Gi

  django:
    replicas: 1
    migrations:
      enabled: true

  nginx:
    podSecurityContext:
      fsGroup: 101

  files:
    upload:
      enabled: true
    authentication:
      requireForDownloads: false
      userinfoUrl: https://iam-et.cloud.cnaf.infn.it/userinfo

  storage:
    payload:
      create: true
      storageClass: escape-vre-shared-volume-storage-class
      size: 2Gi

  pgbouncer:
    enabled: false

  ingress:
    enabled: false
