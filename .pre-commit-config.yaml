repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
    - id: codespell
      additional_dependencies:
        - tomli

  - repo: https://github.com/norwoodj/helm-docs
    rev: "v1.14.2"
    hooks:
    - id: helm-docs-built
      args:
        - "--chart-search-root=./vre"

  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.24
    hooks:
    - id: helmlint
      args:
        - "--chart-dir=vre"

  - repo: local
    hooks:
    - id: kubeconform
      name: Validate Helm templates with kubeconform
      files: &render_inputs ^(vre/(templates/.*\.(ya?ml|tpl)|values\.yaml|values\.schema\.json|linter_values\.yaml|Chart\.yaml|\.helmignore)|scripts/scan\.sh|\.pre-commit-config\.yaml|\.trivyignore)$
      entry: bash -euo pipefail -c '
        cache="${HOME:?}/.cache/kubeconform"; mkdir -p "$cache";
        helm template vre ./vre -f vre/linter_values.yaml --kube-version 1.31.0 | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.31.0 -cache "$cache" -summary -output pretty - '
      language: system
      pass_filenames: false

    - id: trivy-config
      name: Scan the chart for misconfiguration
      files: *render_inputs
      entry: ./scripts/scan.sh
      language: system
      pass_filenames: false
